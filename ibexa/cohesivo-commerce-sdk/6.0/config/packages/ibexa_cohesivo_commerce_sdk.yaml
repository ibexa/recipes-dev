ibexa:
    repositories:
        default:
            product_catalog:
                regions:
                    default: ~

    siteaccess:
        list: [import]
        groups:
            site_group: [import]
            storefront_group: [site]

    system:
        default:
            user_content_type_identifier: ['customer', 'member']

        site:
            user_content_type_identifier: ['customer']
            user_registration:
                user_type_identifier: 'customer'
                group_remote_id: ibexa_customer_group

        admin_group:
            user_content_type_identifier: ['customer', 'member']
