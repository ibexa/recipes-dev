# Taken from https://raw.githubusercontent.com/symfony/recipes/refs/heads/main/.github/workflows/callable-flex-update.yml
name: Update Flex endpoint

on:
    workflow_call:
        inputs:
            branch:
                default: main
                required: false
                type: string
            contrib:
                required: false
                type: boolean
            versions_json:
                required: false
                type: string

jobs:
    flex-update:
        name: Update Flex endpoint
        runs-on: ubuntu-26.04

        steps:
            -
                name: Set up the App token and git identity
                uses: ibexa/gh-workflows/actions/setup-app-git-identity@main
                id: bot
                with:
                    gh-client-id: ${{ secrets.AUTOMATION_CLIENT_ID }}
                    gh-client-secret: ${{ secrets.AUTOMATION_CLIENT_SECRET }}

            -
                name: Checkout
                uses: actions/checkout@v7
                id: checkout
                with:
                    fetch-depth: 0
                    token: ${{ steps.bot.outputs.token }}

            -
                name: Install tools
                run: |
                    cd .github
                    wget -q -O recipes-checker.zip https://codeload.github.com/symfony-tools/recipes-checker/zip/refs/heads/main
                    unzip recipes-checker.zip
                    cd recipes-checker-main
                    composer install --ansi --no-dev

            -
                name: Update Flex endpoint
                env:
                    FLEX_BRANCH: flex/${{ inputs.branch == 'master' && 'main' || inputs.branch }}
                run: |
                    mkdir .github/flex-endpoint
                    git ls-tree HEAD */*/* | php .github/recipes-checker-main/run generate:flex-endpoint ${{ github.repository }} ${{ inputs.branch }} $FLEX_BRANCH .github/flex-endpoint ${{ inputs.versions_json }} ${{ inputs.contrib && '--contrib' || '' }}
                    if git show-ref --verify --quiet "refs/remotes/origin/$FLEX_BRANCH"; then
                        git switch "$FLEX_BRANCH"
                    else
                        git switch --orphan "$FLEX_BRANCH"
                    fi
                    git rm -q --ignore-unmatch *.json
                    mv .github/flex-endpoint/*.json .
                    git add *.json
                    cp -a .github/flex-endpoint/archived .
                    git add archived/
                    php .github/recipes-checker-main/run generate:recipes-readme index.json ${{ inputs.contrib && '--contrib' || '' }} > RECIPES.md
                    git add RECIPES.md
                    git commit -m 'Update Flex endpoint' || true
                    git push origin -f "$FLEX_BRANCH"
